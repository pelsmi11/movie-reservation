plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.hectormartinezmoreira'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Spring Security Core & Config
    implementation 'org.springframework.security:spring-security-core:6.2.4'
    implementation 'org.springframework.security:spring-security-config:6.2.4'
    implementation 'org.springframework.security:spring-security-web:6.2.4'
    implementation 'org.springframework:spring-web:6.1.6'
    implementation 'org.springframework:spring-context:6.1.6'
    implementation 'org.springframework:spring-core:6.1.6'

    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'jwt-core'
            from components.java
        }
    }
    repositories {
        maven {
            name = "jwt-core-repo"
            url = uri("https://maven.pkg.github.com/pelsmi11/movie-reservation")
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv("USERNAME_GITHUB")
                password = project.findProperty('gpr.token') ?: System.getenv("TOKEN_GITHUB")
            }
        }
    }
}