plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}
group = 'com.hectormartinezmoreira.jwtcore'
version = '1.0.0'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Spring Security Core & Config
    implementation 'org.springframework.security:spring-security-core:6.2.4'
    implementation 'org.springframework.security:spring-security-config:6.2.4'
    // Spring Security Web (para OncePerRequestFilter, WebAuthenticationDetailsSource)
    implementation 'org.springframework.security:spring-security-web:6.2.4'
    // Spring Web (para HttpHeaders)
    implementation 'org.springframework:spring-web:6.1.6'
    implementation 'org.springframework:spring-context:6.1.6'
    implementation 'org.springframework:spring-core:6.1.6'

    // Jakarta Servlet API
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Lombok para builder, getter, data, etc.
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Junit para tests (con versión)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}